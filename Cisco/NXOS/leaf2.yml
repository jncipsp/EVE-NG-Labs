nv overlay evpn
feature bgp
feature isis
feature vn-segment-vlan-based
feature nv overlay

interface Ethernet1/1
ip address 2.2.2.2/30
ip router isis 1
no shutdown

interface Ethernet1/2
ip address 5.5.5.2/30
ip router isis 1
no shutdown

interface Ethernet1/3
switchport
switchport access vlan 789
no shutdown

interface loopback0
ip address 10.10.10.10/32
ip router isis 1
cli alias name wr copy run start
line console
exec-timeout 60
line vty
router isis 1
net 49.0000.1010.0000.0000.00
is-type level-2
router bgp 65400
router-id 10.10.10.10
neighbor 7.7.7.7
remote-as 65400
update-source loopback0
address-family l2vpn evpn
send-community extended
neighbor 8.8.8.8
remote-as 65400
update-source loopback0
address-family l2vpn evpn
send-community extended
evpn
vni 100789 l2
rd 10.10.10.10:789
route-target import 65400:789
route-target export 65400:789