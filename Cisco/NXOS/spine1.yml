nv overlay evpn
feature bgp
feature isis
feature vn-segment-vlan-based
feature nv overlay

interface Ethernet1/1
ip address 1.1.1.1/30
ip router isis 1
no shutdown

interface Ethernet1/2
ip address 2.2.2.1/30
ip router isis 1
no shutdown

interface Ethernet1/3
