nv overlay evpn
feature bgp
feature isis
feature vn-segment-vlan-based
feature nv overlay

interface Ethernet1/1
ip address 3.3.3.2/30
ip router isis 1
no shutdown

interface Ethernet1/2
ip address 6.6.6.2/30
ip router isis 1
no shutdown

interface loopback0
ip address 11.11.11.11/32
ip router isis 1
cli alias name wr copy run start
line console
exec-timeout 60
line vty
router isis 1
net 49.0000.1111.1111.0000.00
is-type level-2
router bgp 65400
router-id 11.11.11.11
neighbor 7.7.7.7
remote-as 65400
update-source loopback0
address-family l2vpn evpn
send-community extended
neighbor 8.8.8.8
remote-as 65400
update-source loopback0
address-family l2vpn evpn
send-community extended