hostname pe2

interface Loopback0
ipv4 address 7.7.7.7 255.255.255.255

interface GigabitEthernet0/0/0/0
ipv4 address 2.2.2.2 255.255.255.252

interface GigabitEthernet0/0/0/1.234 l2transport
encapsulation dot1q 234

route-policy ALL
pass
end-policy

router isis 1
is-type level-2-only
net 49.0000.7777.7777.7777.00
address-family ipv4 unicast
metric-style wide
segment-routing mpls

interface Loopback0
address-family ipv4 unicast
prefix-sid absolute 300

interface GigabitEthernet0/0/0/0
address-family ipv4 unicast

router bgp 65400
address-family l2vpn evpn

neighbor 6.6.6.6
remote-as 65400
update-source Loopback0
address-family l2vpn evpn
route-policy ALL in
route-policy ALL out

l2vpn
xconnect group VPWS
p2p VPWS
interface GigabitEthernet0/0/0/1.234
neighbor evpn evi 1 target 234 source 235
