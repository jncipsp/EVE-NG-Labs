hostname pe1

interface Loopback0
ipv4 address 5.5.5.5 255.255.255.255
 
interface GigabitEthernet0/0/0/0
ipv4 address 1.1.1.1 255.255.255.252

interface GigabitEthernet0/0/0/1.234 l2transport
encapsulation dot1q 234

route-policy ALL
pass
end-policy

router isis 1
is-type level-2-only
net 49.0000.5555.5555.5555.00
address-family ipv4 unicast
metric-style wide
segment-routing mpls

interface Loopback0
address-family ipv4 unicast
prefix-sid index 100

interface GigabitEthernet0/0/0/0
address-family ipv4 unicast

router bgp 65400
address-family l2vpn evpn
!
neighbor 6.6.6.6
remote-as 65400
update-source Loopback0
address-family l2vpn evpn
route-policy ALL in
route-policy ALL out
  
l2vpn
xconnect group VPWS
p2p VPWS
interface GigabitEthernet0/0/0/1.234
neighbor evpn evi 1 target 235 source 234