hostname p2
  
explicit-path name PE4
index 10 next-address strict ipv4 unicast 7.7.7.7

ipv4 unnumbered mpls traffic-eng Loopback0

interface Loopback0
ipv4 address 6.6.6.6 255.255.255.255

interface tunnel-te1
ipv4 unnumbered Loopback0
signalled-name PE4
autoroute announce
destination 8.8.8.8
path-option 1 explicit name PE4

interface GigabitEthernet0/0/0/0
ipv4 address 1.1.1.2 255.255.255.252
no shut

interface GigabitEthernet0/0/0/1
ipv4 address 2.2.2.1 255.255.255.252
no shut

interface GigabitEthernet0/0/0/2
ipv4 address 1.4.4.2 255.255.255.252
no shut

router isis 1
is-type level-2-only
net 49.0000.6666.6666.6666.00
interface Loopback0
address-family ipv4 unicast
interface GigabitEthernet0/0/0/0
address-family ipv4 unicast
interface GigabitEthernet0/0/0/1
address-family ipv4 unicast
interface GigabitEthernet0/0/0/2
address-family ipv4 unicast
 
mpls traffic-eng
interface GigabitEthernet0/0/0/0
interface GigabitEthernet0/0/0/1