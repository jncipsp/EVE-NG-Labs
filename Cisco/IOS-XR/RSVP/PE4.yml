hostname pe4
  
explicit-path name PE2
index 10 next-address strict ipv4 unicast 5.5.5.5
ipv4 unnumbered mpls traffic-eng Loopback0
  
interface Loopback0
ipv4 address 8.8.8.8 255.255.255.255

interface tunnel-te1
ipv4 unnumbered Loopback0
signalled-name PE2
autoroute announce
destination 7.7.7.7
path-option 1 explicit name PE2

interface GigabitEthernet0/0/0/0
ipv4 address 3.3.3.2 255.255.255.252
no shut

interface GigabitEthernet0/0/0/1
ipv4 address 4.4.4.1 255.255.255.252
no shut

interface GigabitEthernet0/0/0/2
ipv4 address 1.6.6.1 255.255.255.252
no shut

router isis 1
is-type level-2-only
net 49.0000.8888.8888.8888.00
interface Loopback0
address-family ipv4 unicast
interface GigabitEthernet0/0/0/0
address-family ipv4 unicast
interface GigabitEthernet0/0/0/1
address-family ipv4 unicast
interface GigabitEthernet0/0/0/2
address-family ipv4 unicast