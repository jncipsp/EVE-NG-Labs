hostname rr
  
interface Loopback0
ipv4 address 9.9.9.9 255.255.255.255

interface GigabitEthernet0/0/0/0
ipv4 address 1.3.3.2 255.255.255.252
no shut

interface GigabitEthernet0/0/0/1
