set system host-name leaf3
set interfaces ge-0/0/0 unit 0 family inet address 8.8.8.1/31
set interfaces ge-0/0/0 unit 0 family iso
set interfaces ge-0/0/1 unit 0 family inet address 11.11.11.1/31
set interfaces ge-0/0/1 unit 0 family iso
set interfaces ge-0/0/2 unit 0 family ethernet-switching interface-mode access
set interfaces ge-0/0/2 unit 0 family ethernet-switching vlan members data2
set interfaces lo0 unit 0 family inet address 5.5.5.5/32
set interfaces lo0 unit 0 family iso address 49.0000.5555.0000.0000.00
set policy-options policy-statement NHS term 1 from protocol bgp
set policy-options policy-statement NHS term 1 then next-hop self
set routing-options router-id 5.5.5.5
set routing-options autonomous-system 65530
set routing-options forwarding-table chained-composite-next-hop ingress evpn
set protocols bgp group OVERLAY type internal
set protocols bgp group OVERLAY local-address 5.5.5.5
set protocols bgp group OVERLAY family evpn signaling
set protocols bgp group OVERLAY export NHS
set protocols bgp group OVERLAY neighbor 1.1.1.1
set protocols bgp group OVERLAY neighbor 2.2.2.2
set protocols isis interface ge-0/0/0.0
set protocols isis interface ge-0/0/1.0
set protocols isis interface lo0.0 passive
set protocols isis level 1 disable
set protocols isis level 2 wide-metrics-only
set vlans data2 vlan-id 133