set chassis aggregated-devices ethernet device-count 10
set chassis network-services enhanced-ip
set services rpm twamp server authentication-mode none
set services rpm twamp server light
set interfaces et-0/0/0 gigether-options 802.3ad ae0
set interfaces et-0/0/1 gigether-options 802.3ad ae2
set interfaces ae0 unit 0 family iso
set interfaces ae0 unit 0 family inet6 address fc00:1:2::2/64
set interfaces ae2 unit 0 family iso
set interfaces ae2 unit 0 family inet6 address fc00:2:4::2/64
set interfaces lo0 unit 0 family iso address 49.0001.0000.0000.0002.00
set interfaces lo0 unit 0 family inet6 address fd00::2/128
set policy-options policy-statement LB then load-balance per-flow
set routing-options flex-algorithm 128 use-transport-class
set routing-options flex-algorithm 129 use-transport-class
set routing-options source-packet-routing srv6 locator LOCATOR_0 algorithm 0
set routing-options source-packet-routing srv6 locator LOCATOR_0 5f00:0:2::/48
set routing-options source-packet-routing srv6 locator LOCATOR_0 micro-sid
set routing-options source-packet-routing srv6 locator LOCATOR_128 algorithm 128
set routing-options source-packet-routing srv6 locator LOCATOR_128 5f00:128:2::/48
set routing-options source-packet-routing srv6 locator LOCATOR_128 micro-sid
set routing-options source-packet-routing srv6 locator LOCATOR_129 algorithm 129
set routing-options source-packet-routing srv6 locator LOCATOR_129 5f00:129:2::/48
set routing-options source-packet-routing srv6 locator LOCATOR_129 micro-sid
set routing-options resolution preserve-nexthop-hierarchy
set routing-options router-id 192.168.0.2
set routing-options route-distinguisher-id-use-router-id
set routing-options autonomous-system 65000
set routing-options ipv6-router-id fd00::2
set routing-options transport-class auto-create
set routing-options forwarding-table srv6-chain-merge
set routing-options forwarding-table export LB
set protocols isis interface ae0.0 level 2 te-metric 100
set protocols isis interface ae0.0 level 2 post-convergence-lfa node-protection
set protocols isis interface ae0.0 delay-metric 10000
set protocols isis interface ae0.0 point-to-point
set protocols isis interface ae0.0 family inet6 bfd-liveness-detection minimum-interval 100
set protocols isis interface ae0.0 family inet6 bfd-liveness-detection multiplier 3
set protocols isis interface ae2.0 level 2 te-metric 100
set protocols isis interface ae2.0 level 2 post-convergence-lfa node-protection
set protocols isis interface ae2.0 delay-metric 10000
set protocols isis interface ae2.0 point-to-point
set protocols isis interface ae2.0 family inet6 bfd-liveness-detection minimum-interval 100
set protocols isis interface ae2.0 family inet6 bfd-liveness-detection multiplier 3
set protocols isis interface ae3.0 delay-metric 10000
set protocols isis interface lo0.0 passive
set protocols isis source-packet-routing flex-algorithm 128
set protocols isis source-packet-routing flex-algorithm 129
set protocols isis source-packet-routing srv6 locator LOCATOR_0 micro-node-sid
set protocols isis source-packet-routing srv6 locator LOCATOR_128 micro-node-sid
set protocols isis source-packet-routing srv6 locator LOCATOR_129 micro-node-sid
set protocols isis source-packet-routing traffic-statistics statistics-granularity per-interface
set protocols isis source-packet-routing traffic-statistics congestion-protection
set protocols isis level 1 disable
set protocols isis level 2 wide-metrics-only
set protocols isis spf-options microloop-avoidance post-convergence-path
set protocols isis backup-spf-options use-post-convergence-lfa maximum-backup-paths 8
set protocols isis backup-spf-options use-source-packet-routing
set protocols isis traffic-engineering l3-unicast-topology
set protocols isis traffic-engineering ipv6
set protocols isis traffic-engineering advertisement always
set protocols isis no-ipv4-routing
set protocols mpls log-updown syslog
set protocols lldp interface all