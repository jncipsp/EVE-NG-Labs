set chassis network-services enhanced-ip
set interfaces ge-0/0/0 unit 0 family inet address 172.28.1.5/31
set interfaces ge-0/0/0 unit 0 family iso
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/1 unit 0 family inet address 33.33.33.1/30
set interfaces lo0 unit 0 family inet address 11.11.11.11/32
set interfaces lo0 unit 0 family iso address 49.0001.1111.0000.0000.00
set interfaces lo0 unit 0 family mpls
set policy-options policy-statement EXP_LOOPBACK term 1 from interface lo0.0
set policy-options policy-statement EXP_LOOPBACK term 1 then accept
set policy-options policy-statement NHS term 1 from protocol bgp
set policy-options policy-statement NHS term 1 then next-hop self
set routing-instances COMPANY-C instance-type vrf
set routing-instances COMPANY-C interface ge-0/0/1.0
set routing-instances COMPANY-C route-distinguisher 11.11.11.11:3
set routing-instances COMPANY-C vrf-target target:65400:3
set routing-instances COMPANY-C vrf-table-label
set routing-instances COMPANY-C protocols bgp group COMPANY-C type external
set routing-instances COMPANY-C protocols bgp group COMPANY-C as-override
set routing-instances COMPANY-C protocols bgp group COMPANY-C neighbor 33.33.33.2 peer-as 65222
set routing-options router-id 11.11.11.11
set routing-options autonomous-system 65100
set protocols bgp group INTERNAL type internal
set protocols bgp group INTERNAL local-address 11.11.11.11
set protocols bgp group INTERNAL family inet labeled-unicast resolve-vpn
set protocols bgp group INTERNAL export NHS
set protocols bgp group INTERNAL neighbor 9.9.9.9 family inet labeled-unicast resolve-vpn
set protocols bgp group EXTERNAL local-address 11.11.11.11
set protocols bgp group EXTERNAL family inet-vpn unicast
set protocols bgp group EXTERNAL export EXP_LOOPBACK
set protocols bgp group EXTERNAL neighbor 3.3.3.3 multihop
set protocols bgp group EXTERNAL neighbor 3.3.3.3 peer-as 65400
set protocols isis source-packet-routing srgb start-label 9000
set protocols isis source-packet-routing srgb index-range 5000
set protocols isis source-packet-routing node-segment ipv4-index 45
set protocols isis level 1 disable
set protocols isis level 2 wide-metrics-only
set protocols isis interface ge-0/0/0.0
set protocols isis interface lo0.0
set protocols mpls icmp-tunneling
set protocols mpls interface lo0.0
set protocols mpls interface ge-0/0/0.0