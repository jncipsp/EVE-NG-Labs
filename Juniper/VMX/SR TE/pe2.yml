set chassis network-services enhanced-ip
set interfaces ge-0/0/0 unit 0 family inet address 4.4.4.2/30
set interfaces ge-0/0/0 unit 0 family iso
set interfaces ge-0/0/0 unit 0 family mpls
set interfaces ge-0/0/2 flexible-vlan-tagging
set interfaces ge-0/0/2 encapsulation flexible-ethernet-services
set interfaces ge-0/0/2 unit 444 encapsulation vlan-ccc
set interfaces ge-0/0/2 unit 444 vlan-id 444
set interfaces lo0 unit 0 family inet address 8.8.8.8/32
set interfaces lo0 unit 0 family iso address 49.0000.8888.0000.0000.00
set interfaces lo0 unit 0 family mpls
set routing-options router-id 8.8.8.8
set routing-options autonomous-system 65400
set protocols mpls interface all
set protocols bgp group VPWS type internal
set protocols bgp group VPWS local-address 8.8.8.8
set protocols bgp group VPWS family evpn signaling
set protocols bgp group VPWS export NHS
set protocols bgp group VPWS neighbor 6.6.6.6
set protocols isis source-packet-routing srgb start-label 1000
set protocols isis source-packet-routing srgb index-range 9000
set protocols isis source-packet-routing node-segment ipv4-index 800
set protocols isis level 1 disable
set protocols isis level 2 wide-metrics-only
set protocols isis interface ge-0/0/0.0
set protocols isis interface ge-0/0/1.0
set protocols isis interface lo0.0 passive
set policy-options policy-statement NHS term 1 from protocol bgp
set policy-options policy-statement NHS term 1 then next-hop self
set routing-instances VPWS instance-type evpn-vpws
set routing-instances VPWS interface ge-0/0/2.444
set routing-instances VPWS route-distinguisher 8.8.8.8:1
set routing-instances VPWS vrf-target target:65400:1
set routing-instances VPWS protocols evpn interface ge-0/0/2.444 vpws-service-id local 44
set routing-instances VPWS protocols evpn interface ge-0/0/2.444 vpws-service-id remote 22