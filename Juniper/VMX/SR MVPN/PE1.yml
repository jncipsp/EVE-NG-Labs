set routing-instances MVPN instance-type vrf
set routing-instances MVPN interface ge-0/0/0.0
set routing-instances MVPN route-distinguisher 5.5.5.5:1
set routing-instances MVPN vrf-target target:65400:1
set routing-instances MVPN vrf-table-label
set routing-instances MVPN protocols bgp group MVPN type external
set routing-instances MVPN protocols bgp group MVPN as-override
set routing-instances MVPN protocols bgp group MVPN neighbor 10.1.1.254 peer-as 65444