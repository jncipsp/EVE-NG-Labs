spbm
spbm ethertype 0x8100
interface GigabitEthernet 1/1
encapsulation dot1q
interface GigabitEthernet 1/2
encapsulation dot1q
interface GigabitEthernet 1/3
encapsulation dot1q
router isis
spbm 1
spbm 1 nick-name 1.00.84
spbm 1 b-vid 4051-4052 primary 4051
spbm 1 ip enable
vlan members remove 1 1/1-1/3
vlan create 4051 type spbm-bvlan
vlan create 4052 type spbm-bvlan
interface GigabitEthernet 1/1
default-vlan-id 0
no shutdown
isis
isis spbm 1
isis enable
no spanning-tree mstp  force-port-state enable
no spanning-tree mstp msti 62 force-port-state enable
interface GigabitEthernet 1/2
default-vlan-id 0
no shutdown
isis
isis spbm 1
isis enable
no spanning-tree mstp  force-port-state enable
no spanning-tree mstp msti 62 force-port-state enable
interface GigabitEthernet 1/3
default-vlan-id 0
no shutdown
isis
isis spbm 1
isis enable
no spanning-tree mstp  force-port-state enable
no spanning-tree mstp msti 62 force-port-state enable
interface loopback 1
ip address 1 10.1.1.1/255.255.255.255
router isis
sys-name "spine1"
